plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pixelbridge.complications'
    compileSdk 36

    defaultConfig {
        applicationId "com.pixelbridge.complications"
        minSdk 30
        targetSdk 36
        versionCode 210
        versionName "2.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0'
    implementation 'androidx.wear:wear:1.4.0'
    implementation 'androidx.wear.tiles:tiles:1.6.0'
    implementation 'androidx.wear.tiles:tiles-material:1.6.0'
    implementation 'androidx.wear.protolayout:protolayout-material3:1.3.0'
    implementation 'androidx.health:health-services-client:1.1.0-beta01'
    implementation 'androidx.health.connect:connect-client:1.1.0-beta01'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
